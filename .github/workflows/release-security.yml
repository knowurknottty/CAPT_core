name: Release Security

on:
  pull_request:
    branches: [main, integration/inversion-labs-current-r2]
  push:
    branches: [main, release/capt-standalone-final]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and audit tooling
        run: python -m pip install --upgrade pip pytest jsonschema build pip-audit
      - name: Build wheel (no editable install before wheel proof)
        run: python -m build --wheel
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed import smoke test
        run: |
          cd /tmp
          python - <<'PY'
          import capt_solo
          import capt_solo.components
          from capt_solo.components import AntiTokenExtractionComponent
          import importlib.metadata as md
          print("capt_solo import: PASS")
          print("components import: PASS")
          print("distribution:", md.version("capt-solo"))
          PY
      - name: Install pinned Anti-Token-Extraction
        continue-on-error: true
        id: anti_token
        run: |
          python -m pip install git+https://github.com/knowurknottty/anti-token-extraction.git@b68adac7311b2315d992592b479e6761aa9dc856
      - name: Verify pinned provenance (if install succeeded)
        if: steps.anti_token.outcome == 'success'
        run: |
          python - <<'PY'
          from capt_solo.components.anti_token_extraction import installed_provenance, PINNED_COMMIT, PINNED_VERSION
          p = installed_provenance()
          assert p["version"] == PINNED_VERSION, p
          assert p["commit"] == PINNED_COMMIT, p
          print(p)
          PY
      - name: Note if Anti-Token-Extraction unavailable
        id: security_gate
        if: always()
        run: |
          if [ "${{ steps.anti_token.outcome }}" = "success" ]; then
            echo "SECURITY_GATE=FULL_SECURITY_GATE" >> "$GITHUB_OUTPUT"
            echo "::notice::Security gate: FULL_SECURITY_GATE (anti-token-extraction installed and verified)"
          else
            echo "SECURITY_GATE=DEGRADED_OPTIONAL_DEPENDENCY" >> "$GITHUB_OUTPUT"
            echo "::warning::Security gate: DEGRADED_OPTIONAL_DEPENDENCY — anti-token-extraction private dependency unavailable on hosted CI. The rest of the security suite still runs, but this optional anti-token-extraction check is skipped. This is NOT a FULL_SECURITY_GATE."
          fi
      - name: Assert security gate classification is explicit (never silent green)
        if: always()
        run: |
          gate="${{ steps.security_gate.outputs.SECURITY_GATE }}"
          echo "Explicit security gate classification: $gate"
          if [ -z "$gate" ]; then
            echo "::error::Security gate classification missing; cannot assume FULL_SECURITY_GATE."
            exit 1
          fi
      - name: Test suite report
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
      - name: Enforce test suite
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Runtime verification
        run: python verify_runtime.py
      - name: Compile all Python
        run: python -m compileall -q capt_solo capt_runtime tests
      - name: Security invariants
        run: |
          ! grep -R -n -E 'aws_access_key|github_token|slack_token|stripe_key|rtk_cache_lookup|classify_auth\(api_key' capt_solo capt_runtime
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("capt_solo/components/anti_token_extraction.mcp.json").read_text())
          assert cfg["transport"] == "stdio"
          assert cfg["mcp_server"]["args"] == ["-m", "anti_token_extraction.server"]
          assert cfg["mcp_server"]["credentials_in_args"] is False
          assert cfg["mcp_server"]["network_enabled"] is False
          PY
      - name: Audit shipped Python dependency closure
        run: |
          python -m pip freeze --exclude-editable > /tmp/runtime-requirements.txt
          pip-audit -r /tmp/runtime-requirements.txt

  billing-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify OpenRouter release key has a provider-side hard cap
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENROUTER_RELEASE_KEY: ${{ secrets.OPENROUTER_RELEASE_KEY }}
        run: |
          test -n "$OPENROUTER_RELEASE_KEY" || { echo "::error::OPENROUTER_RELEASE_KEY is not configured"; exit 1; }
          python -m capt_runtime.billing_assurance \
            --provider openrouter \
            --key-env OPENROUTER_RELEASE_KEY \
            --source-sha "$SOURCE_SHA" \
            --output billing-assurance.json
      - name: Upload billing assurance receipt
        uses: actions/upload-artifact@v4
        with:
          name: capt-billing-assurance
          path: billing-assurance.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checklist-gate:
    name: CAPT checklist security gate
    runs-on: ubuntu-latest
    needs: [python, secrets, billing-assurance]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Verify security-gate machinery
        run: python -m pytest -q tests/capt_runtime/test_security_gate.py tests/capt_runtime/test_security_evidence.py
      - name: Generate ephemeral exact-head evidence from completed checks
        id: evidence
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHON_JOB: ${{ needs.python.result }}
          SECRETS_JOB: ${{ needs.secrets.result }}
          BILLING_JOB: ${{ needs.billing-assurance.result }}
        run: |
          args=()
          if [ "$SECRETS_JOB" = "success" ]; then
            args+=(--pass "VIBE1-02=gitleaks:full-history")
          fi
          if [ "$PYTHON_JOB" = "success" ]; then
            args+=(--pass "VIBE1-20=pip-audit:installed-runtime-closure")
            args+=(--pass-manifest security/profiles/capt-core-python-evidence.json)
          fi
          if [ "$PYTHON_JOB" = "success" ] && [ "$BILLING_JOB" = "success" ]; then
            args+=(--pass "CAPT-SUP-07=openrouter:hard-key-cap+pytest:tests/capt_runtime/test_release_security_assurance.py::test_runtime_provider_governor_emits_durable_data_minimized_spend_alert")
          fi
          python -m capt_runtime.security_evidence \
            --source-sha "$SOURCE_SHA" \
            --verifier "release-security-ci" \
            "${args[@]}" \
            --output security-evidence.json
      - name: Download live billing assurance receipt
        if: needs.billing-assurance.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: capt-billing-assurance
          path: billing-assurance
      - name: Evaluate exact-head CAPT security control gate
        id: checklist
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m capt_runtime.security_gate evaluate \
            --profile security/profiles/capt-core.json \
            --evidence security-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --output security-gate-result.json
      - name: Upload security evidence and gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capt-security-gate
          path: |
            security-evidence.json
            security-gate-result.json
            billing-assurance/
      - name: Enforce fail-closed checklist gate
        if: steps.checklist.outcome != 'success'
        run: |
          echo "::error::CAPT release security checklist is BLOCKED. Applicable controls require exact-head verification evidence."
          exit 1
