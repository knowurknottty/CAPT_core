name: Native macOS Swift

on:
  push:
    branches: [integration/inversion-labs-current-r2, integration/inversion-labs-core-converged-r3]
    paths:
      - "capt_ui/surfaces/desktop_swift/**"
      - ".github/workflows/native-macos-swift.yml"
  pull_request:
    paths:
      - "capt_ui/surfaces/desktop_swift/**"
      - ".github/workflows/native-macos-swift.yml"

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: capt_ui/surfaces/desktop_swift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build native app target
        run: swift build --product CAPTNativeMac
