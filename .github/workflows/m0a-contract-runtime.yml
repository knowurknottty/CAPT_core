name: M0-A Contract & Runtime Proof

on:
  pull_request:
    branches: [main, integration/inversion-labs-current-r2]
  push:
    branches: [main, release/capt-standalone-final]

permissions:
  contents: read

jobs:
  contract-drift:
    name: Contract binding drift + generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate bindings and assert no drift
        run: |
          python3 contracts/tools/generate.py
          python3 contracts/tools/check_drift.py
      - name: Assert generation is reproducible (byte-identical)
        run: |
          python3 - <<'PY'
          import subprocess, tempfile, filecmp, pathlib, os
          a = tempfile.mkdtemp(); b = tempfile.mkdtemp()
          subprocess.run(["python3","contracts/tools/generate.py","--out",a],check=True)
          subprocess.run(["python3","contracts/tools/generate.py","--out",b],check=True)
          def rel(p, root): return os.path.relpath(p, root)
          la = sorted(rel(str(x), a) for x in pathlib.Path(a).rglob('*') if x.is_file())
          lb = sorted(rel(str(x), b) for x in pathlib.Path(b).rglob('*') if x.is_file())
          assert la == lb, "file sets differ"
          for r in la:
              assert filecmp.cmp(os.path.join(a, r), os.path.join(b, r), shallow=False), f"drift at {r}"
          print("REPRODUCIBLE_OK")
          PY

  typescript:
    name: TypeScript bindings build + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build generated TypeScript
        working-directory: contracts/generated/typescript
        run: npm install && npm run build
      - name: Cross-language fixture parity
        run: node contracts/tools/ts_parity.mjs

  python-tests:
    name: Python conformance suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest jsonschema build
      - name: Run M0-A conformance suite
        run: python -m pytest tests/capt_runtime -q
      - name: Run full regression
        run: python -m pytest tests/ -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel (no editable)
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Clean import smoke test (installed, no source on path)
        run: |
          cd /tmp
          python - <<'PY'
          import capt_runtime, capt_solo, capt_contracts
          import capt_runtime.verification
          import capt_runtime.composition
          import capt_runtime.drivers.hermes
          import capt_runtime.drivers.openharness
          import capt_runtime.memory.governor
          import capt_runtime.memory.contextpack
          import capt_solo.khsb.bus
          import capt_solo.ctp.journal
          import capt_solo.memory.engine
          print("INSTALLED_IMPORT_OK")
          PY
      - name: Package content inspection
        run: |
          python - <<'PY'
          import zipfile, os
          wheels = [f for f in os.listdir("dist") if f.endswith(".whl")]
          assert len(wheels) == 1, f"expected 1 wheel, got {wheels}"
          z = zipfile.ZipFile(os.path.join("dist", wheels[0]))
          names = z.namelist()
          assert any(n.startswith("capt_runtime/") for n in names), "capt_runtime missing"
          assert any(n.startswith("capt_solo/") for n in names), "capt_solo missing"
          assert any(n.startswith("capt_contracts/") for n in names), "capt_contracts missing"
          assert any(n.startswith("desktop/") for n in names), "desktop missing"
          assert any(n == "capt_cli.py" for n in names), "capt_cli.py missing"
          assert any("khsb" in n for n in names), "khsb missing"
          assert any("ctp" in n for n in names), "ctp missing"
          print("PACKAGE_CONTENT_OK")
          PY
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
