name: Independent CAPT Audit 602dc5a

on:
  pull_request:
    branches:
      - integration/capt-v05-final-audit

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable audit target
        uses: actions/checkout@v4
        with:
          ref: 602dc5a205c581c67cec55c3ff609f2cde65b0a4
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install independent audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pyyaml

      - name: Record immutable preflight
        run: |
          mkdir -p independent_audit
          git rev-parse HEAD | tee independent_audit/source_sha.txt
          git status --short | tee independent_audit/preflight_git_status.txt
          python --version | tee independent_audit/python_version.txt
          python -m pip freeze | sort > independent_audit/pip_freeze.txt

      - name: Build wheel and sdist from exact checkout
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python -m build --outdir independent_audit/build 2>&1 | tee independent_audit/build.log
          build_rc=${PIPESTATUS[0]}
          echo "$build_rc" > independent_audit/build_rc.txt
          if compgen -G "independent_audit/build/*" > /dev/null; then
            sha256sum independent_audit/build/* | tee independent_audit/build_sha256.txt
          fi
          exit "$build_rc"

      - name: Install built wheel outside repository
        id: wheel_install
        continue-on-error: true
        run: |
          set -o pipefail
          WHEEL=$(find "$GITHUB_WORKSPACE/independent_audit/build" -maxdepth 1 -name '*.whl' -print -quit)
          rm -rf "$RUNNER_TEMP/capt-wheel-venv"
          python -m venv "$RUNNER_TEMP/capt-wheel-venv"
          "$RUNNER_TEMP/capt-wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/capt-wheel-venv/bin/python" -m pip install "$WHEEL"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/capt-wheel-venv/bin/python" - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/independent_audit/wheel_smoke.log"
          import importlib.metadata as md
          import json
          import pathlib
          import subprocess
          import sys
          import capt_solo

          package_file = pathlib.Path(capt_solo.__file__).resolve()
          venv_root = pathlib.Path(sys.prefix).resolve()
          result = {
              "distribution_version": md.version("capt-solo"),
              "module_version": getattr(capt_solo, "__version__", None),
              "module_file": str(package_file),
              "sys_prefix": str(venv_root),
              "loaded_from_venv": venv_root in package_file.parents,
          }
          print(json.dumps(result, indent=2))
          if not result["loaded_from_venv"]:
              raise SystemExit("capt_solo was not imported from the clean wheel venv")
          if result["distribution_version"] != "0.5.0":
              raise SystemExit("unexpected installed distribution version")
          doctor = subprocess.run(
              [sys.executable, "-m", "capt_cli", "doctor"],
              cwd="/tmp",
              capture_output=True,
              text=True,
          )
          print("doctor_rc=", doctor.returncode)
          print((doctor.stdout or doctor.stderr)[:4000])
          if doctor.returncode != 0:
              raise SystemExit("installed wheel doctor failed")
          PY
          smoke_rc=${PIPESTATUS[0]}
          echo "$smoke_rc" > "$GITHUB_WORKSPACE/independent_audit/wheel_smoke_rc.txt"
          exit "$smoke_rc"

      - name: Run repository test suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee independent_audit/pytest.log
          test_rc=${PIPESTATUS[0]}
          echo "$test_rc" > independent_audit/pytest_rc.txt
          exit "$test_rc"

      - name: Run governed audit four times in one isolated home
        id: governed
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/capt-governed-audit"
          mkdir -p "$RUNNER_TEMP/capt-governed-audit"
          for run in 1 2 3 4; do
            set +e
            CAPT_SOLO_HOME="$RUNNER_TEMP/capt-governed-audit" \
              python tools/audit/governed_audit.py \
              > "independent_audit/governed_run_${run}.json" \
              2> "independent_audit/governed_run_${run}.stderr"
            rc=$?
            set -e
            echo "$rc" > "independent_audit/governed_run_${run}.rc"
          done
          cp -a "$RUNNER_TEMP/capt-governed-audit/audit" independent_audit/governed_artifacts

      - name: Inspect and falsify governed evidence chain
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path("independent_audit")
          runs = [json.loads((root / f"governed_run_{i}.json").read_text()) for i in range(1, 5)]
          totals = [r["receipts_total"] for r in runs]
          expected_accumulation = [8, 17, 26, 35]

          journal_path = root / "governed_artifacts" / "ctp_journal.jsonl"
          receipts = [json.loads(line) for line in journal_path.read_text().splitlines() if line.strip()]
          evidence_pkg = json.loads((root / "governed_artifacts" / "evidence_package.json").read_text())
          bubble = json.loads((root / "governed_artifacts" / "knowledge_bubble.json").read_text())
          result = json.loads((root / "governed_artifacts" / "audit_result.json").read_text())
          report = (root / "governed_artifacts" / "audit_report.md").read_text()

          run1_receipts = runs[0]["receipts_total"]
          verifier_receipts = [r for r in receipts if r.get("step") == "independent-verification"]
          verifier_observed_totals = [r.get("evidence", {}).get("receipts_total") for r in verifier_receipts]

          inspection = {
              "receipt_totals_by_run": totals,
              "expected_append_only_pattern": expected_accumulation,
              "matches_append_only_pattern": totals == expected_accumulation,
              "run1_clean_receipt_total": run1_receipts,
              "final_journal_receipts": len(receipts),
              "independent_verifier_receipt_count": len(verifier_receipts),
              "independent_verifier_observed_package_totals": verifier_observed_totals,
              "evidence_package_receipts": len(evidence_pkg.get("receipts", [])),
              "knowledge_bubble_receipts": len(bubble.get("receipts", [])),
              "audit_result_receipts": result.get("receipts_total"),
              "human_report_source_sha_unfrozen": "**Source SHA:** UNFROZEN" in report,
              "finding_count": result.get("findings_total"),
              "claim_guard_receipts": [
                  r for r in receipts
                  if r.get("step") == "claim-guard"
              ],
          }
          (root / "governed_inspection.json").write_text(json.dumps(inspection, indent=2))

          if totals != expected_accumulation:
              raise SystemExit(f"unexpected receipt accumulation pattern: {totals}")
          if run1_receipts != 8:
              raise SystemExit(f"clean run should contain 8 receipts, observed {run1_receipts}")
          if len(verifier_receipts) != 3:
              raise SystemExit(f"expected verifier only on runs 2-4, observed {len(verifier_receipts)}")
          if verifier_observed_totals != [8, 17, 26]:
              raise SystemExit(f"verifier did not inspect prior-run packages as expected: {verifier_observed_totals}")
          PY

      - name: Test frozen-candidate identity against a post-freeze code change
        run: |
          git config user.name "Independent Audit Runner"
          git config user.email "audit@example.invalid"
          git switch -c local-falsification
          printf '\n# independent-audit post-freeze implementation mutation\n' >> capt_solo/pulse.py
          git add capt_solo/pulse.py
          git commit -m "audit: post-freeze implementation mutation"
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from capt_solo.release_validation import validate_release

          checks = validate_release(Path.cwd(), final=True)
          rows = [asdict(check) for check in checks]
          candidate_rows = [row for row in rows if row["check_id"].startswith("candidate.")]
          Path("independent_audit/candidate_identity_after_code_mutation.json").write_text(
              json.dumps(candidate_rows, indent=2)
          )
          sha_match = next(row for row in candidate_rows if row["check_id"] == "candidate.sha_match")
          clean_tree = next(row for row in candidate_rows if row["check_id"] == "candidate.clean_tree")
          if sha_match["status"] != "pass" or clean_tree["status"] != "pass":
              raise SystemExit("candidate checks did not demonstrate ancestor-based acceptance")
          PY

      - name: Check manifest identity convergence and checksum usability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          public_api = json.loads(Path("docs/release/PUBLIC_API_MANIFEST_V0.5.json").read_text())
          release_artifacts = json.loads(Path("release_artifacts/RELEASE_ARTIFACT_MANIFEST_V0.5.json").read_text())
          result = {
              "public_api_candidate_sha": public_api.get("candidate_sha"),
              "artifact_manifest_candidate_sha": release_artifacts.get("candidate_sha"),
              "candidate_sha_match": public_api.get("candidate_sha") == release_artifacts.get("candidate_sha"),
          }
          Path("independent_audit/manifest_identity_comparison.json").write_text(json.dumps(result, indent=2))
          PY
          set +e
          (cd release_artifacts && sha256sum -c SHA256SUMS.txt) \
            > independent_audit/sha256sums_check.log 2>&1
          sums_rc=$?
          set -e
          echo "$sums_rc" > independent_audit/sha256sums_check.rc

      - name: Write independent audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("independent_audit")
          def read(name, default="missing"):
              p = root / name
              return p.read_text().strip() if p.exists() else default

          summary = {
              "target_sha": read("source_sha.txt"),
              "build_rc": read("build_rc.txt"),
              "wheel_smoke_rc": read("wheel_smoke_rc.txt"),
              "pytest_rc": read("pytest_rc.txt"),
              "governed_run_rcs": [read(f"governed_run_{i}.rc") for i in range(1, 5)],
              "sha256sums_check_rc": read("sha256sums_check.rc"),
          }
          for name in (
              "governed_inspection.json",
              "candidate_identity_after_code_mutation.json",
              "manifest_identity_comparison.json",
          ):
              p = root / name
              if p.exists():
                  summary[name] = json.loads(p.read_text())
          (root / "INDEPENDENT_AUDIT_SUMMARY.json").write_text(json.dumps(summary, indent=2))
          PY

      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-capt-audit-602dc5a
          path: independent_audit/
          if-no-files-found: error
