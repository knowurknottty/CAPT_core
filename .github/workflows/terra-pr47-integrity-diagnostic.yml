name: Terra PR47 Integrity Diagnostic

on:
  push:
    branches:
      - verify/terra-pr47-approval-hardening-r1
    paths:
      - tools/terra_diagnose_ouroboros_integrity.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest jsonschema
      - run: python tools/terra_diagnose_ouroboros_integrity.py
      - run: python -m pytest -vv -s tests/capt_runtime/test_ouroboros_lifecycle.py::test_happy_driver_lifecycle_is_terminal_and_consumed
