[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capt-solo"
version = "0.5.0"
description = "Local-first cognitive runtime for individual developers, integrating with Hermes."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["textual>=0.80"]
license = { text = "MIT" }
keywords = ["capt", "hermes", "memory", "cognitive", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/knowurknottty/CAPT_core"

[project.scripts]
capt = "capt_cli:main"
capt-ui = "capt_ui.operator.cli:main"

[project.optional-dependencies]
ui = ["textual>=0.80"]

[project.entry-points.hermes_plugins]
capt-solo = "capt_solo.plugin:get_plugin"

[tool.setuptools]
py-modules = ["capt_cli"]

[tool.setuptools.packages.find]
where = [".", "contracts/generated/python"]
include = ["capt_solo*", "capt_runtime*", "capt_contracts*", "desktop*", "capt_ui*", "capt_lab*"]
namespaces = true

[tool.setuptools.package-data]
"capt_solo.components" = ["*.json"]
"capt_lab" = ["donors/*.json"]
"capt_solo.plugin" = ["*.json"]
"capt_solo.skills" = ["**/*.md"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: test spawns a real external runtime process (seconds to minutes)",
]
