[tool.pytest.ini_options]
# Live Gate A tests invoke the genuine OpenHarness binary + a local Ollama model.
# They are marked `slow` and deselected by default so the core suite (including
# the frozen 51-test M0-B conformance suite) runs without external model access.
addopts = "-m 'not slow'"
markers = [
    "slow: test invokes the genuine external OpenHarness harness + local Ollama model",
]
