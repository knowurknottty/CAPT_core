[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capt-solo"
version = "0.5.0"
description = "Local-first cognitive runtime for individual developers, integrating with Hermes."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["capt", "hermes", "memory", "cognitive", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=5.4",
]

[project.urls]
Homepage = "https://github.com/inversion-labs/capt-solo"

[project.entry-points.hermes_plugins]
capt-solo = "capt_solo.plugin:get_plugin"

[project.scripts]
capt = "capt_cli:main"

[tool.setuptools]
include-package-data = false
py-modules = ["capt_cli"]

[tool.setuptools.packages.find]
include = [
    "capt_solo",
    "capt_solo.*",
]
namespaces = false

[tool.setuptools.package-data]
capt_solo = [
    "plugin/plugin.json",
    "skills/*/SKILL.md",
]
